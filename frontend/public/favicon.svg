<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Navy Brand Background Gradient matching Sidebar & Dashboard Buttons -->
    <linearGradient id="brand-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Subtle Border Glow -->
    <linearGradient id="brand-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Dark Slate Navy Rounded Square Card -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#brand-bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="url(#brand-border)" stroke-width="8"/>

  <!-- Minimalist Crisp White Wallet Icon -->
  <g transform="translate(116, 128) scale(11.8)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wallet Main Shell -->
    <path d="M 19 7 C 19 5.895 18.105 5 17 5 L 5 5 C 3.895 5 3 5.895 3 7 L 3 17 C 3 18.105 3.895 19 5 19 L 17 19 C 18.105 19 19 18.105 19 17 Z"/>
    <!-- Wallet Flap Line -->
    <path d="M 16 11 L 21 11 C 21.552 11 22 11.448 22 12 L 22 14 C 22 14.552 21.552 15 21 15 L 16 15 C 15.448 15 15 14.552 15 14 L 15 12 C 15 11.448 15.448 11 16 11 Z"/>
    <!-- Wallet Clasp Circle -->
    <circle cx="18.5" cy="13" r="0.75" fill="#FFFFFF"/>
  </g>

  <!-- Green Live Indicator Dot (Matching System Live Badge) -->
  <circle cx="400" cy="112" r="28" fill="#16A34A"/>
  <circle cx="400" cy="112" r="20" fill="#22C55E"/>
</svg>
